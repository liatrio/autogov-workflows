name: Release Reusable Workflow

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch to cut the release from (default: main).'
        required: false
        type: string
        default: main
      mutations-config:
        description: 'Path to the mutations config file (e.g. .autogov-release.yaml).'
        required: false
        type: string
        default: ''
      dry-run:
        description: 'Run in dry-run mode (no commits, tags, or releases created).'
        required: false
        type: boolean
        default: false
      autogov-version:
        description: 'The autogov release version to download and use.'
        required: false
        type: string
        default: v1.1.2
      vsa-artifact-id:
        description: 'Comma-delimited artifact IDs of VSAs to upload as release assets.'
        required: false
        type: string
        default: ''
      expected-vsa-artifact-count:
        description: 'Required number of normalized VSA artifact IDs; zero disables the count check.'
        required: false
        type: number
        default: 0
      blob-artifact-id:
        description: 'Comma-delimited artifact IDs of blobs to publish as release assets.'
        required: false
        type: string
        default: ''
      expected-blob-artifact-count:
        description: 'Required number of normalized blob artifact IDs; zero disables the count check.'
        required: false
        type: number
        default: 0
      workflow-runner-label:
        description: 'The label of the workflow runner.'
        required: false
        type: string
        default: ubuntu-latest
      github-token:
        description: >
          GitHub token used for the binary download when octo-sts-read-scope
          is empty. Leave empty to use github.token (suitable for public repos).
        required: false
        type: string
        default: ''
      octo-sts-read-scope:
        description: >
          octo-sts scope for the private-repo autogov CLI download. Leave empty
          to use github-token — correct for public repos.
        required: false
        type: string
        default: ''
      octo-sts-read-identity:
        description: octo-sts read identity (used only when octo-sts-read-scope is set).
        required: false
        type: string
        default: ''
      octo-sts-release-scope:
        description: >
          octo-sts scope for the write path (release cut commit/tag and asset
          upload). Defaults to liatrio. External orgs with a protected main must
          override this with their own scope whose octo-sts app is on the branch
          ruleset bypass list — github.token cannot bypass a ruleset.
        required: false
        type: string
        default: liatrio
      octo-sts-release-identity:
        description: octo-sts write identity for the release cut and asset upload.
        required: false
        type: string
        default: release-ops
    outputs:
      version:
        description: 'The version of the release that was cut.'
        value: ${{ jobs.release-cut-high-perms.outputs.version }}
      tag:
        description: 'The tag created for the release.'
        value: ${{ jobs.release-cut-high-perms.outputs.tag }}
      commit-sha:
        description: 'The SHA of the release commit.'
        value: ${{ jobs.release-cut-high-perms.outputs.commit-sha }}
      commit-verified:
        description: 'Whether the release commit is verified.'
        value: ${{ jobs.release-cut-high-perms.outputs.commit-verified }}

permissions: {}

jobs:
  release-cut-high-perms:
    runs-on: ${{ inputs.workflow-runner-label }}
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', inputs.branch) }}
    permissions:
      contents: write
      id-token: write
      actions: read
    outputs:
      version: ${{ steps.release-cut.outputs.version }}
      tag: ${{ steps.release-cut.outputs.tag }}
      commit-sha: ${{ steps.release-cut.outputs.commit-sha }}
      commit-verified: ${{ steps.verify-signature.outputs.verified }}
    steps:
      - name: Fail if Runner is self-hosted
        if: ${{ runner.environment != 'github-hosted' }}
        run: |
          echo "Job is running on a self-hosted runner. Terminating job..."
          exit 1

      - name: Checkout code
        if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo-sts-read
        if: ${{ inputs.octo-sts-read-scope != '' }}
        with:
          scope: ${{ inputs.octo-sts-read-scope }}
          identity: ${{ inputs.octo-sts-read-identity }}

      - name: Install autogov
        env:
          GH_TOKEN: ${{ inputs.octo-sts-read-scope == '' && (inputs.github-token || github.token) || steps.octo-sts-read.outputs.token }}
        run: |
          gh release download ${{ inputs.autogov-version }} \
            --repo liatrio/autogov \
            --pattern "autogov"
          chmod +x autogov
          sudo mv autogov /usr/local/bin/autogov

      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo-sts-release
        with:
          scope: ${{ inputs.octo-sts-release-scope }}
          identity: ${{ inputs.octo-sts-release-identity }}

      - name: Show release plan
        run: |
          echo "=== Release Plan ==="
          autogov release plan --repo . -o json
          echo ""
          autogov release plan --repo .

      - name: Normalize release artifact IDs
        id: normalize-artifact-ids
        env:
          VSA_ARTIFACT_IDS: ${{ inputs.vsa-artifact-id }}
          BLOB_ARTIFACT_IDS: ${{ inputs.blob-artifact-id }}
          EXPECTED_VSA_ARTIFACT_COUNT: ${{ inputs.expected-vsa-artifact-count }}
          EXPECTED_BLOB_ARTIFACT_COUNT: ${{ inputs.expected-blob-artifact-count }}
        run: |
          set -euo pipefail

          normalize_ids() {
            local label="$1"
            local raw="$2"
            local token
            local trimmed
            local joined
            local -a normalized=()

            IFS=',' read -r -a tokens <<< "$raw"
            for token in "${tokens[@]}"; do
              trimmed="${token#"${token%%[![:space:]]*}"}"
              trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
              [ -n "$trimmed" ] || continue
              if [[ ! "$trimmed" =~ ^[0-9]+$ ]]; then
                echo "::error::${label} contains a non-numeric artifact ID: ${trimmed}" >&2
                return 1
              fi
              normalized+=("$trimmed")
            done

            joined=""
            if [ "${#normalized[@]}" -gt 0 ]; then
              joined="$(IFS=,; echo "${normalized[*]}")"
            fi
            printf '%s' "$joined"
          }

          validate_expected_count() {
            local label="$1"
            local expected_count="$2"
            local normalized_ids="$3"
            local actual_count=0
            local -a values=()

            if [[ ! "$expected_count" =~ ^[0-9]+$ ]]; then
              echo "::error::expected ${label} artifact count must be a non-negative integer: ${expected_count}" >&2
              return 1
            fi
            if [ -n "$normalized_ids" ]; then
              IFS=',' read -r -a values <<< "$normalized_ids"
              actual_count="${#values[@]}"
            fi
            if [ "$expected_count" -gt 0 ] && [ "$actual_count" -ne "$expected_count" ]; then
              echo "::error::expected ${expected_count} ${label} artifact IDs but received ${actual_count}" >&2
              return 1
            fi
          }

          normalized_vsa_ids="$(normalize_ids vsa-artifact-id "$VSA_ARTIFACT_IDS")"
          normalized_blob_ids="$(normalize_ids blob-artifact-id "$BLOB_ARTIFACT_IDS")"
          validate_expected_count VSA "$EXPECTED_VSA_ARTIFACT_COUNT" "$normalized_vsa_ids"
          validate_expected_count blob "$EXPECTED_BLOB_ARTIFACT_COUNT" "$normalized_blob_ids"
          {
            echo "vsa-artifact-ids=${normalized_vsa_ids}"
            echo "blob-artifact-ids=${normalized_blob_ids}"
          } >> "$GITHUB_OUTPUT"

      # stage every release asset BEFORE the cut so a single `release cut --asset
      # ... --publish` uploads them while the release is still a draft, then flips
      # it to published — under GitHub immutable releases assets cannot be added or
      # clobbered after publish, so post-publish uploads would hard-fail.
      # stage UNDER $RUNNER_TEMP (off the worktree): `release cut --repo .` runs a
      # clean-worktree check in its default (auto) mode, so downloading these into
      # the checked-out tree would dirty it and fail the cut (autogov's own release
      # stages to $RUNNER_TEMP for the same reason). cert-identities.json stays at the
      # repo root because it is a tracked/committed file (does not dirty the tree).
      - name: Download VSA artifact
        if: ${{ steps.normalize-artifact-ids.outputs.vsa-artifact-ids != '' && inputs.dry-run == false }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          artifact-ids: ${{ steps.normalize-artifact-ids.outputs.vsa-artifact-ids }}
          path: ${{ runner.temp }}/release-artifacts/vsa
          merge-multiple: false

      - name: Download blob artifact
        if: ${{ steps.normalize-artifact-ids.outputs.blob-artifact-ids != '' && inputs.dry-run == false }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          artifact-ids: ${{ steps.normalize-artifact-ids.outputs.blob-artifact-ids }}
          path: ${{ runner.temp }}/release-artifacts/blob
          merge-multiple: false

      - name: Download attestation bundles
        # pull this run's verified attestation bundles so the release can ship the
        # full bundle for offline verify-from-release. a `pattern` download does not
        # fail on zero matches, so a build with no attestations just yields an empty
        # dir (assemble step skips); a REAL download failure must surface here rather
        # than silently shipping a truncated evidence bundle, so do NOT swallow it.
        if: ${{ inputs.dry-run == false }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          pattern: '*-attestation-*-perms'
          path: ${{ runner.temp }}/attestation-bundles
      - name: Assemble full attestation bundle asset
        # concatenate every verified attestation bundle (build-provenance + sbom +
        # vuln/dep-scan + metadata + source-review) into one line-delimited file an
        # offline verifier re-evaluates against policy (autogov offline --attestations).
        # the *.jsonl filter naturally excludes the VSA artifact (a .json) the pattern
        # also matches. skip silently if none are present (e.g. a build with no attests).
        # written under $RUNNER_TEMP (off the worktree) so the cut's clean-tree check holds.
        if: ${{ inputs.dry-run == false }}
        run: |
          out="$RUNNER_TEMP/autogov.attestations.intoto.jsonl"
          rm -f "$out"
          count=0
          if [ -d "$RUNNER_TEMP/attestation-bundles" ]; then
            while IFS= read -r f; do
              cat "$f" >> "$out"
              [ -n "$(tail -c1 "$f")" ] && echo >> "$out"
              count=$((count + 1))
            done < <(find "$RUNNER_TEMP/attestation-bundles" -type f -name '*.jsonl' | sort)
          fi
          if [ "$count" -gt 0 ]; then
            echo "assembled $count attestation bundles into $out"
          else
            echo "::notice::no attestation bundles found; skipping full-bundle asset"
            rm -f "$out"
          fi
      - name: Stage build-provenance as a single .intoto.jsonl (OpenSSF Scorecard)
        # Scorecard detects release provenance from a single *.intoto.jsonl asset
        # (the build-provenance statement), distinct from the full offline bundle
        # above. named <repo>.intoto.jsonl; skips gracefully if none is present.
        if: ${{ inputs.dry-run == false }}
        run: |
          # deterministic selection: walk the sorted matches and keep the first,
          # warning if a run produced more than one build-provenance bundle (e.g.
          # image + blob in the same run) so the attached asset is reproducible.
          # guard the dir-exists (a build with no attestation bundles leaves it
          # absent) and avoid grep -c (exits 1 on zero matches) so set -e does not
          # fail the release when there is simply nothing to attach.
          prov=""
          n=0
          if [ -d "$RUNNER_TEMP/attestation-bundles" ]; then
            while IFS= read -r f; do
              n=$((n + 1))
              if [ -z "$prov" ]; then prov="$f"; fi
            done < <(find "$RUNNER_TEMP/attestation-bundles" -type f -path '*build-provenance*' -name '*.jsonl' 2>/dev/null | sort)
          fi
          if [ "$n" -gt 1 ]; then
            echo "::warning::found $n build-provenance bundles; attaching the first by sorted path ($prov)"
          fi
          if [ -n "$prov" ] && [ -s "$prov" ]; then
            cp "$prov" "$RUNNER_TEMP/${GITHUB_REPOSITORY##*/}.intoto.jsonl"
            echo "staged scorecard provenance asset: ${GITHUB_REPOSITORY##*/}.intoto.jsonl (from $prov)"
          else
            echo "::notice::no build-provenance bundle found; skipping scorecard .intoto.jsonl asset"
          fi

      - name: Stage release assets
        env:
          NORMALIZED_VSA_ARTIFACT_IDS: ${{ steps.normalize-artifact-ids.outputs.vsa-artifact-ids }}
          NORMALIZED_BLOB_ARTIFACT_IDS: ${{ steps.normalize-artifact-ids.outputs.blob-artifact-ids }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail

          stage_dir="$RUNNER_TEMP/staged-release-assets"
          vsa_dir="$RUNNER_TEMP/release-artifacts/vsa"
          blob_dir="$RUNNER_TEMP/release-artifacts/blob"
          rm -rf "$stage_dir"
          mkdir -p "$stage_dir"

          declare -A asset_sources=()
          declare -A vsa_basename_counts=()

          artifact_id_count() {
            local ids="$1"
            local -a values=()

            if [ -n "$ids" ]; then
              IFS=',' read -r -a values <<< "$ids"
            fi
            printf '%s' "${#values[@]}"
          }

          validate_artifact_directories() {
            local label="$1"
            local ids="$2"
            local download_dir="$3"
            local expected_count
            local source_count=0
            local source_dir

            expected_count="$(artifact_id_count "$ids")"
            [ "$expected_count" -gt 0 ] || return 0
            if [ "$DRY_RUN" == "true" ]; then
              return 0
            fi
            if [ ! -d "$download_dir" ]; then
              echo "::error::${label} expected ${expected_count} source artifact directories but found 0 under '${download_dir}'"
              return 1
            fi
            if [ "$expected_count" -eq 1 ]; then
              if ! find "$download_dir" -type f -size +0c -print -quit | grep -q .; then
                echo "::error::${label} source artifact contains no non-empty files under '${download_dir}'"
                return 1
              fi
              return 0
            fi
            while IFS= read -r -d '' source_dir; do
              source_count=$((source_count + 1))
              if ! find "$source_dir" -type f -size +0c -print -quit | grep -q .; then
                echo "::error::${label} source artifact directory contains no non-empty files: '${source_dir}'"
                return 1
              fi
            done < <(find "$download_dir" -mindepth 1 -maxdepth 1 -type d -print0 | sort -z)
            if [ "$source_count" -ne "$expected_count" ]; then
              echo "::error::${label} expected ${expected_count} source artifact directories but found ${source_count} under '${download_dir}'"
              return 1
            fi
          }

          stage_asset() {
            local source="$1"
            local asset_name="$2"
            local previous_source="${asset_sources[$asset_name]-}"

            if [ -n "$previous_source" ]; then
              echo "::error::release asset basename collision for '${asset_name}': '${previous_source}' conflicts with '${source}'"
              return 1
            fi
            asset_sources["$asset_name"]="$source"
            cp -- "$source" "$stage_dir/$asset_name"
            echo "staged release asset: $source -> $asset_name"
          }

          validate_artifact_directories VSA "$NORMALIZED_VSA_ARTIFACT_IDS" "$vsa_dir"
          validate_artifact_directories blob "$NORMALIZED_BLOB_ARTIFACT_IDS" "$blob_dir"

          vsa_file_count=0
          if [ -d "$vsa_dir" ]; then
            while IFS= read -r -d '' source; do
              [ -s "$source" ] || continue
              basename="${source##*/}"
              vsa_basename_counts["$basename"]=$(( ${vsa_basename_counts[$basename]:-0} + 1 ))
              vsa_file_count=$((vsa_file_count + 1))
            done < <(find "$vsa_dir" -type f -print0 | sort -z)
          fi
          if [ "$DRY_RUN" != "true" ] && [ -n "$NORMALIZED_VSA_ARTIFACT_IDS" ] && [ "$vsa_file_count" -eq 0 ]; then
            echo "::error::VSA artifact IDs were provided but no non-empty VSA files were downloaded"
            exit 1
          fi

          if [ -d "$vsa_dir" ]; then
            while IFS= read -r -d '' source; do
              [ -s "$source" ] || continue
              basename="${source##*/}"
              asset_name="$basename"
              if [ "${vsa_basename_counts[$basename]}" -gt 1 ]; then
                case "$basename" in
                  vsa-*.json)
                    relative_source="${source#"$vsa_dir"/}"
                    source_identity="${relative_source%%/*}"
                    source_prefix="$(printf '%s' "$source_identity" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
                    if [ -z "$source_prefix" ]; then
                      echo "::error::cannot deterministically namespace duplicate VSA '${basename}' from '${source}'"
                      exit 1
                    fi
                    asset_name="${source_prefix}--${basename}"
                    ;;
                esac
              fi
              stage_asset "$source" "$asset_name"
            done < <(find "$vsa_dir" -type f -print0 | sort -z)
          fi

          blob_file_count=0
          if [ -d "$blob_dir" ]; then
            while IFS= read -r -d '' source; do
              [ -s "$source" ] || continue
              blob_file_count=$((blob_file_count + 1))
              stage_asset "$source" "${source##*/}"
            done < <(find "$blob_dir" -type f -print0 | sort -z)
          fi
          if [ "$DRY_RUN" != "true" ] && [ -n "$NORMALIZED_BLOB_ARTIFACT_IDS" ] && [ "$blob_file_count" -eq 0 ]; then
            echo "::error::blob artifact IDs were provided but no non-empty blob files were downloaded"
            exit 1
          fi

          for source in \
            cert-identities.json \
            "$RUNNER_TEMP/autogov.attestations.intoto.jsonl" \
            "$RUNNER_TEMP/${GITHUB_REPOSITORY##*/}.intoto.jsonl"; do
            if [ -f "$source" ] && [ -s "$source" ]; then
              stage_asset "$source" "${source##*/}"
            fi
          done

      - name: Run release cut
        id: release-cut
        env:
          GH_TOKEN: ${{ steps.octo-sts-release.outputs.token }}
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_BRANCH: ${{ inputs.branch }}
          MUTATIONS_CONFIG: ${{ inputs.mutations-config }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail

          ARGS=(--repo . --branch "$RELEASE_BRANCH")

          if [ -n "$MUTATIONS_CONFIG" ]; then
            ARGS+=(--mutations-config "$MUTATIONS_CONFIG")
          fi

          if [ "$DRY_RUN" == "true" ]; then
            ARGS+=(--dry-run)
          else
            ARGS+=(--publish)
          fi

          # append one --asset per staged file that actually exists + is non-empty
          # (the cut validates each path up front, so only pass present files): the
          # VSA, blob, generated, and tracked files have already been copied into one
          # collision-checked staging directory. Walk it recursively so this exact
          # publish path cannot omit nested artifact contents.
          add_asset() {
            if [ -f "$1" ] && [ -s "$1" ]; then
              ARGS+=(--asset "$1")
              echo "staging asset: $1"
            fi
          }
          if [ -d "$RUNNER_TEMP/staged-release-assets" ]; then
            while IFS= read -r -d '' asset; do
              add_asset "$asset"
            done < <(find "$RUNNER_TEMP/staged-release-assets" -type f -print0 | sort -z)
          fi

          echo "=== Running: autogov release cut ${ARGS[*]} -o json ==="
          OUTPUT=$(autogov release cut "${ARGS[@]}" -o json)
          echo "$OUTPUT"

          # check if no release was needed
          NO_RELEASE=$(echo "$OUTPUT" | jq -r '.no_release // false')
          if [ "$NO_RELEASE" == "true" ]; then
            REASON=$(echo "$OUTPUT" | jq -r '.reason // empty')
            echo "::notice::No release needed: ${REASON}"
            exit 0
          fi

          # parse outputs
          VERSION=$(echo "$OUTPUT" | jq -r '.version // empty')
          TAG=$(echo "$OUTPUT" | jq -r '.tag_name // empty')
          COMMIT_SHA=$(echo "$OUTPUT" | jq -r '.commit_sha // empty')
          RELEASE_ID=$(echo "$OUTPUT" | jq -r '.release_id // empty')

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "commit-sha=${COMMIT_SHA}"
            echo "release-id=${RELEASE_ID}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify commit signature
        id: verify-signature
        if: ${{ inputs.dry-run == false && steps.release-cut.outputs.commit-sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT_SHA="${{ steps.release-cut.outputs.commit-sha }}"
          echo "=== Verifying commit ${COMMIT_SHA} ==="
          RESULT=$(gh api repos/${{ github.repository }}/commits/${COMMIT_SHA} \
            --jq '{verified: .commit.verification.verified, reason: .commit.verification.reason}')
          echo "$RESULT"

          VERIFIED=$(echo "$RESULT" | jq -r '.verified')
          echo "verified=${VERIFIED}" >> "$GITHUB_OUTPUT"

          if [ "$VERIFIED" != "true" ]; then
            echo "::error::Release commit is NOT verified!"
            exit 1
          fi
          echo "::notice::Release commit is verified ✅"
