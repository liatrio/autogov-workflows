name: Slack Alert Workflow

on:
  workflow_run:
    workflows: ['Release Caller Workflow']
    types: [completed]
    branches: main

permissions: {}

jobs:
  alert:
    runs-on: ubuntu-latest
    permissions:
      actions: read # gh run view reads the failed run's jobs and steps
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      # Keep notification code in this trusted workflow; never execute failed-run code.
      - name: Send Slack alert
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -z "${SLACK_WEBHOOK:-}" ]; then
            echo "::notice::SLACK_WEBHOOK is not configured; skipping Slack alert."
            exit 0
          fi

          run_id=$(jq -er '.workflow_run.id | tostring' "$GITHUB_EVENT_PATH")
          if ! jobs=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json jobs); then
            echo "::warning::Failed to look up failed jobs; linking to the workflow run."
            jobs='{"jobs":[]}'
          fi

          # Choose one job and its first failed step, regardless of API response order.
          # Event/API strings stay JSON data, including embedded quotes and newlines.
          jq \
            --slurpfile event "$GITHUB_EVENT_PATH" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg server "$GITHUB_SERVER_URL" '
            . as $jobs
            | $event[0].workflow_run as $run
            | ($jobs.jobs // [] | map(select(.conclusion == "failure"))
              | sort_by(.databaseId) | first) as $job
            | ($job.steps // [] | map(select(.conclusion == "failure"))
              | sort_by(.number) | first | .name // "unknown") as $step
            | ($run.html_url // ($server + "/" + $repository + "/actions/runs/" + ($run.id | tostring))) as $run_url
            | (if $job.databaseId then $run_url + "/job/" + ($job.databaseId | tostring)
              else $run_url end) as $failure_url
            | (if $job.databaseId then "View Failed Job" else "View Failed Run" end) as $link_label
            | ($run.head_sha // "unknown") as $sha
            | {
                attachments: [{
                  color: "#FF0000",
                  blocks: [
                    {
                      type: "header",
                      text: {type: "plain_text", text: "🚨 Pipeline Failure", emoji: true}
                    },
                    {
                      type: "section",
                      fields: [
                        {type: "mrkdwn", text: ("*Repository:*\n" + $repository)},
                        {type: "mrkdwn", text: ("*Failed Step:*\n`" + $step + "`")}
                      ]
                    },
                    {
                      type: "section",
                      fields: [
                        {type: "mrkdwn", text: ("*Triggered By:*\n" + ($run.triggering_actor.login // $run.actor.login // "unknown"))},
                        {type: "mrkdwn", text: ("*Commit:*\n`" + $sha[:7] + "`")}
                      ]
                    },
                    {
                      type: "section",
                      text: {
                        type: "mrkdwn",
                        text: ("*Commit Message:*\n```" + ($run.head_commit.message // "unknown") + "```")
                      }
                    },
                    {
                      type: "section",
                      fields: [
                        {type: "mrkdwn", text: ("<" + $failure_url + "|❌ " + $link_label + ">")},
                        {type: "mrkdwn", text: ("<" + $server + "/" + $repository + "/tree/" + $sha + "|:github: View Repository>")}
                      ]
                    }
                  ]
                }]
              }
          ' <<< "$jobs" | curl --fail --silent --show-error \
            -X POST -H 'Content-Type: application/json' \
            --data-binary @- "$SLACK_WEBHOOK"
